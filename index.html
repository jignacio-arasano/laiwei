<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrainMetrics</title>
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>
<body>
  <div id="view-session"></div>
  <div class="hidden" id="view-routines"></div>
  <div class="hidden" id="view-volume"></div>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <script src="js/metrics.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {
          // Si falla (por ejemplo al abrir directo con file://), la app sigue
          // funcionando igual: el service worker solo mejora el modo offline/instalación.
        });
      });
    }
  </script>
</body>
</html>
